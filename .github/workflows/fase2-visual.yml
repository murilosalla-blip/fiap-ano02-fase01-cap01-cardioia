name: Validar MLP visual da Fase 2

on:
  push:
    branches:
      - main
      - fase-2-machine-learning
    paths:
      - "src/fase2/**"
      - "config/fase2/**"
      - "assets/fase2/**"
      - "scripts/fase2/**"
      - "document/other/fase2/**"
      - "src/fase2/portal-cardioia/**"
      - "assets/fase1/dados/processed/heart_disease_cleveland.csv"
      - "assets/fase1/imagens/ecg/**"
      - ".github/workflows/fase2-visual.yml"
  pull_request:
    paths:
      - "src/fase2/**"
      - "config/fase2/**"
      - "assets/fase2/**"
      - "scripts/fase2/**"
      - "document/other/fase2/**"
      - "src/fase2/portal-cardioia/**"
      - "assets/fase1/dados/processed/heart_disease_cleveland.csv"
      - "assets/fase1/imagens/ecg/**"
      - ".github/workflows/fase2-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-mlp:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config/fase2/requirements-visual.txt

      - name: Instalar dependências visuais
        run: python -m pip install -r config/fase2/requirements-visual.txt

      - name: Verificar sintaxe
        run: |
          python -m py_compile src/fase2/src/treinar_mlp_ecg.py
          python -m py_compile src/fase2/src/preparar_visual_ampliado.py
          python -m py_compile src/fase2/src/treinar_mlp_ecg_ampliada.py
          python -m py_compile src/fase2/tests/test_visual.py
          python -m py_compile src/fase2/tests/test_visual_ampliado.py

      - name: Testar dados e arquitetura
        run: python src/fase2/tests/test_visual.py

      - name: Treinar e avaliar MLP
        run: python src/fase2/src/treinar_mlp_ecg.py

      - name: Executar notebook visual
        run: |
          python -m nbconvert --to notebook --execute src/fase2/notebooks/mlp_ecg_binaria.ipynb --output-dir assets/fase2/resultados/visual --output mlp_ecg_binaria_executada.ipynb --ExecutePreprocessor.timeout=900

      - name: Preparar base visual ampliada
        run: python src/fase2/src/preparar_visual_ampliado.py --cache /tmp/cardioia-ecg-raw

      - name: Testar dados e arquitetura ampliados
        run: python src/fase2/tests/test_visual_ampliado.py

      - name: Treinar e avaliar MLP ampliada
        run: python src/fase2/src/treinar_mlp_ecg_ampliada.py

      - name: Executar notebook visual ampliado
        run: |
          python -m nbconvert --to notebook --execute src/fase2/notebooks/mlp_ecg_ampliada.ipynb --output-dir assets/fase2/resultados/visual_ampliado --output mlp_ecg_ampliada_executada.ipynb --ExecutePreprocessor.timeout=900

      - name: Conferir saídas
        run: |
          test -s assets/fase2/resultados/visual/metricas_mlp_ecg.json
          test -s assets/fase2/resultados/visual/inventario_binario.csv
          test -s assets/fase2/resultados/visual/previsoes_mlp_ecg.csv
          test -s assets/fase2/resultados/visual/modelo_mlp_ecg.keras
          test -s assets/fase2/resultados/visual/curva_perda_mlp.png
          test -s assets/fase2/resultados/visual/matriz_confusao_mlp.png
          test -s assets/fase2/resultados/visual/mlp_ecg_binaria_executada.ipynb
          test -s assets/fase2/resultados/visual_ampliado/metricas.json
          test -s assets/fase2/resultados/visual_ampliado/previsoes_teste.csv
          test -s assets/fase2/resultados/visual_ampliado/modelo_mlp_ecg_ampliada.keras
          test -s assets/fase2/resultados/visual_ampliado/historico_treino.csv
          test -s assets/fase2/resultados/visual_ampliado/matriz_confusao.png
          test -s assets/fase2/resultados/visual_ampliado/mlp_ecg_ampliada_executada.ipynb

      - name: Disponibilizar evidências da execução
        uses: actions/upload-artifact@v4
        with:
          name: resultados-mlp-ecg
          path: |
            assets/fase2/resultados/visual/
            assets/fase2/resultados/visual_ampliado/
          if-no-files-found: error
